<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Cancelled — VoltFlow</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            midnight: '#0A1628', navy: '#0D1F3C', 'navy-light': '#122847',
            horizon: '#1478D4', 'horizon-light': '#3A9BE8',
            orange: '#F5821F', 'orange-light': '#FFA54F',
            'grey-light': '#B8C5D1', 'grey-mid': '#6E8099',
          },
          fontFamily: { mono: ['Roboto Mono', 'monospace'], sans: ['Montserrat', 'sans-serif'] },
          letterSpacing: { tightest: '-0.04em' },
        }
      }
    }
  </script>
  <style>
    .nav-blur { background: rgba(10,22,40,0.88); backdrop-filter: blur(16px); }
  </style>
</head>
<body class="bg-midnight font-sans text-white min-h-screen">
  <nav class="fixed top-0 left-0 right-0 z-50 nav-blur border-b border-white/5">
    <div class="max-w-7xl mx-auto px-6 lg:px-8">
      <div class="flex items-center h-16 lg:h-20">
        <a href="index.html">
          <img src="brand_assets/Brand_Logo1.png" alt="VoltFlow" class="h-10 lg:h-12 w-auto object-contain" style="max-width:180px;" />
        </a>
      </div>
    </div>
  </nav>

  <main class="flex items-center justify-center min-h-screen px-6 pt-16">
    <div class="text-center max-w-md w-full">
      <div class="inline-flex items-center justify-center w-20 h-20 rounded-full mb-8" style="background: rgba(20,20,40,0.8); border: 1px solid rgba(255,255,255,0.08);">
        <svg class="w-10 h-10 text-grey-mid" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </div>
      <h1 class="font-mono font-bold text-3xl tracking-tightest text-white mb-4">Payment Cancelled</h1>
      <p class="text-grey-light font-light leading-relaxed mb-8">
        No worries — your cart is still saved. Head back to checkout whenever you're ready.
      </p>
      <div class="flex flex-col sm:flex-row gap-3 justify-center">
        <a href="checkout.html" class="bg-orange hover:bg-orange-light text-white text-sm font-semibold font-mono tracking-wide px-8 py-3.5 rounded-xl transition-colors duration-200">
          Return to Checkout
        </a>
        <a href="shop.html" class="text-sm font-medium font-mono text-grey-light hover:text-white px-8 py-3.5 rounded-xl border border-white/15 hover:border-white/30 transition-colors duration-200">
          Continue Shopping
        </a>
      </div>
    </div>
  </main>
</body>
</html>
